name: Deploy signal relay

# Ships relay code changes to the Worker Terraform created. Secrets (TURN key) persist across
# deploys; they are (re)set by the Infra apply workflow.
on:
  push:
    branches: [main]
    paths: ["server/cloudflare/**", "server/relayHub.ts"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-signal
  cancel-in-progress: false

jobs:
  deploy:
    # Enabled once Cloudflare is set up: repo variable CLOUDFLARE_ACCOUNT_ID (see infra/README.md).
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: wrangler deploy
        working-directory: server/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
