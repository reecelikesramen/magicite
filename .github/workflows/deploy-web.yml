name: Deploy web (Cloudflare Pages)

# Builds the game and uploads it to the Pages project Terraform created (https://shardfall.pages.dev).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    # Enabled once Cloudflare is set up: repo variable CLOUDFLARE_ACCOUNT_ID (see infra/README.md).
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
        env:
          VITE_NOSTR_RELAYS: ${{ vars.NOSTR_RELAYS }}
          VITE_ICE_ENDPOINT: ${{ vars.ICE_ENDPOINT }}
          VITE_DEDICATED_URL: ${{ vars.DEDICATED_URL }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Upload to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=shardfall --branch=main
