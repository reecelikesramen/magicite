# Desktop builds (Electrobun) for macOS (Apple Silicon), Windows and Linux.
# - main: release.yml calls this on every app change and publishes a GitHub Release v0.2.<run>.
# - Tag push `v*`: builds and publishes that version.
# - Push to a claude/** branch touching desktop/**: build check (artifacts on the run).
# - Manual run (Actions tab -> Desktop builds -> Run workflow): artifacts on the run.
# The in-app updater reads releases/latest. Unsigned for now: macOS users right-click -> Open the
# first time; Windows SmartScreen says "More info -> Run anyway". See desktop/README.md.
name: Desktop builds
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: App version (semver, no leading v)
        type: string
        required: true
      release:
        description: Publish a GitHub Release
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: ['claude/**']
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >>"$GITHUB_OUTPUT"
            echo "release=${{ inputs.release }}" >>"$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
          else
            echo "version=0.2.0-dev.${{ github.run_number }}" >>"$GITHUB_OUTPUT"
            echo "release=false" >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04, name: linux-x64-lite, lite: '1' }
    runs-on: ${{ matrix.os }}
    env:
      SHARDFALL_LITE: ${{ matrix.lite || '0' }}
      APP_VERSION: ${{ needs.meta.outputs.version }}
      VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
      RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
      VITE_NOSTR_RELAYS: ${{ vars.NOSTR_RELAYS }}
      VITE_ICE_ENDPOINT: ${{ vars.ICE_ENDPOINT }}
      VITE_DEDICATED_URL: ${{ vars.DEDICATED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - working-directory: desktop
        run: bun install --frozen-lockfile
      - working-directory: desktop
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: shardfall-${{ matrix.name }}
          path: desktop/artifacts/*
          if-no-files-found: error

  release:
    if: needs.meta.outputs.release == 'true'
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-desktop
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Shardfall ${{ needs.meta.outputs.version }}
          files: dist-desktop/*
          generate_release_notes: true
          make_latest: true
