# Publishes the web build to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Optional repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   NOSTR_RELAYS  e.g. wss://shardfall-signal.<you>.workers.dev  (default: public Nostr relays)
#   ICE_ENDPOINT  e.g. https://shardfall-signal.<you>.workers.dev/ice  (TURN credentials)
#   DEDICATED_URL e.g. wss://play.example.org  (adds "Join Server" to the menu)
name: Deploy web build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
        env:
          VITE_NOSTR_RELAYS: ${{ vars.NOSTR_RELAYS }}
          VITE_ICE_ENDPOINT: ${{ vars.ICE_ENDPOINT }}
          VITE_DEDICATED_URL: ${{ vars.DEDICATED_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
